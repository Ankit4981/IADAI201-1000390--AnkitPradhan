<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131B"/>
      <stop offset="50%" stop-color="#14201D"/>
      <stop offset="100%" stop-color="#091E1A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2E2A"/>
      <stop offset="100%" stop-color="#14201D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- Subtle glow circles -->
  <circle cx="150" cy="80" r="140" fill="#2DD4BF" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1050" cy="280" r="160" fill="#3B82F6" opacity="0.08" filter="blur(70px)"/>

  <!-- Border line -->
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="none" stroke="#2DD4BF" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <rect width="80" height="80" rx="20" fill="#2DD4BF"/>
    <text x="40" y="56" font-family="'Manrope', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#042F2C" text-anchor="middle">P</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="210" y="145" font-family="'Manrope', -apple-system, sans-serif" font-weight="800" font-size="48" fill="#FFFFFF" letter-spacing="-0.5px">ParkVision AI</text>
  <text x="212" y="180" font-family="'Manrope', -apple-system, sans-serif" font-weight="500" font-size="20" fill="#2DD4BF" letter-spacing="0.2px">Smart Parking Analytics &amp; Space Optimisation</text>
  <text x="212" y="222" font-family="'Manrope', -apple-system, sans-serif" font-weight="400" font-size="15" fill="#94A3B8">
    YOLOv8 Vision Model · Real-Time Occupancy Analytics · PKLot Benchmark Dataset · Streamlit Dashboard
  </text>

  <!-- Feature Pills -->
  <g transform="translate(212, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="36" rx="18" fill="url(#cardGlow)" stroke="#2DD4BF" stroke-opacity="0.3"/>
    <circle cx="18" cy="18" r="5" fill="#4ADE80"/>
    <text x="32" y="23" font-family="'Manrope', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">99.5% mAP@0.5</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="170" height="36" rx="18" fill="url(#cardGlow)" stroke="#2DD4BF" stroke-opacity="0.3"/>
    <circle cx="198" cy="18" r="5" fill="#60A5FA"/>
    <text x="212" y="23" font-family="'Manrope', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">Full-Lot Coverage</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="180" height="36" rx="18" fill="url(#cardGlow)" stroke="#2DD4BF" stroke-opacity="0.3"/>
    <circle cx="383" cy="18" r="5" fill="#FBBF24"/>
    <text x="397" y="23" font-family="'Manrope', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">WCAG AA Compliant</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="175" height="36" rx="18" fill="url(#cardGlow)" stroke="#2DD4BF" stroke-opacity="0.3"/>
    <circle cx="578" cy="18" r="5" fill="#A855F7"/>
    <text x="592" y="23" font-family="'Manrope', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">Light &amp; Dark Theme</text>
  </g>
</svg>
